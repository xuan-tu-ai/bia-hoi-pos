<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mất kết nối — Bia Hơi Quầy</title>
<style>
  :root { --ground: #f9fafb; --surface: #fff; --border: #e5e7eb; --text: #111827; --muted: #5f6672; --primary: #1d1f20; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 16px; background: var(--ground); color: var(--text);
         font: 15px/22px "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { width: min(420px, 100%); padding: 32px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
  svg { display: block; }
  h1 { margin: 20px 0 8px; font-size: 24px; line-height: 1.2; font-weight: 700; letter-spacing: -0.01em; }
  p { margin: 0 0 24px; color: var(--muted); }
  button { height: 44px; padding: 0 20px; border: 0; border-radius: 6px; background: var(--primary); color: #fff; font: inherit; font-weight: 500; cursor: pointer; }
  button:focus-visible { outline: 2px solid #b45309; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <svg width="48" height="48" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28"><rect width="28" height="28" rx="6" fill="#fdf3e1"/><path d="M7 9h12.5l-1.4 14.2a1.5 1.5 0 0 1-1.5 1.3H9.9a1.5 1.5 0 0 1-1.5-1.3z" fill="#b45309"/><path d="M6.2 9.2c-.6-2.6 1.4-4.7 3.8-4.2.9-1.7 3.3-2.2 4.8-.9 1.6-1.3 4.4-.6 4.9 1.7 1.6.3 2.3 2 1.6 3.4z" fill="#fff" stroke="#78350f" stroke-width="1.2" stroke-linejoin="round"/><path d="M19.4 12h1.9a1.7 1.7 0 0 1 1.7 1.7v4.1a1.7 1.7 0 0 1-1.7 1.7h-2.5" fill="none" stroke="#78350f" stroke-width="1.6"/></svg>
  <h1>Mất kết nối</h1>
  <p>Điện thoại chưa kết nối được tới máy chủ của quán. Kiểm tra Wi-Fi hoặc 4G rồi thử lại; số liệu sẽ hiện ngay khi có mạng.</p>
  <button onclick="location.reload()">Thử lại</button>
</main>
<script>window.addEventListener('online', () => location.reload());</script>
</body>
</html>
