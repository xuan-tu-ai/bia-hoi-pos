<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bia Hơi Quầy — Quản trị</title>
    <meta name="description" content="Doanh thu hôm nay, hao hụt keg bia, nhật ký hủy món và quản trị thực đơn cho quán bia hơi." />
    <meta name="theme-color" content="#f9fafb" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <!-- Đặt giao diện sáng/tối trước khi vẽ để không nháy trắng (xem src/lib/theme.ts) -->
    <script>
      try {
        var t = localStorage.getItem('biahoi-theme-admin');
        // #theme=dark trên địa chỉ: mở thẳng giao diện tối (link demo, ảnh chụp kiểm tra)
        var h = location.hash.match(/theme=(light|dark)/);
        if (h) localStorage.setItem('biahoi-theme-admin', (t = h[1]));
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
