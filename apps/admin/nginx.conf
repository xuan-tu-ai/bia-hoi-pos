server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Backend (service "api" trong docker-compose)
  location /api/ {
    client_max_body_size 3m; # ảnh món (Web quản trị đã thu nhỏ trước khi gửi)
    proxy_pass http://api:3000/;
    proxy_set_header Host $host;
    # Ghi đè (không nối thêm) để máy quầy không tự khai IP giả qua header này
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Socket.IO: cần nâng cấp kết nối lên WebSocket
  location /socket.io/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }

  # Service worker và manifest luôn lấy bản mới, để cập nhật PWA không bị kẹt bản cũ
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; types { application/manifest+json webmanifest; } }

  # Tệp đã build có hash trong tên: lưu đệm lâu
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

  # App quầy (ứng dụng một trang riêng dưới /quay/)
  location /quay/ {
    try_files $uri $uri/ /quay/index.html;
    add_header Cache-Control "no-cache";
  }
  location /quay/assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

  # Web quản trị: mọi đường dẫn khác trả về index.html
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
