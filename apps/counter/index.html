<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bia Hơi Quầy — Máy quầy</title>
    <meta name="description" content="Màn hình quầy: sơ đồ bàn, gọi món, in phiếu, thanh toán VietQR." />
    <link rel="icon" href="/quay/favicon.svg" type="image/svg+xml" />
    <!-- Đặt giao diện sáng/tối trước khi vẽ để không nháy trắng (xem src/lib/theme.ts) -->
    <script>
      try {
        var t = localStorage.getItem('biahoi-theme-counter');
        // #theme=dark trên địa chỉ: mở thẳng giao diện tối (link demo, ảnh chụp kiểm tra)
        var h = location.hash.match(/theme=(light|dark)/);
        if (h) localStorage.setItem('biahoi-theme-counter', (t = h[1]));
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
